# A minimal lab: one human (the admin), a secretary on an on-prem box, one manager on a
# cloud VM of its own (managers run on any host), two cloud GPU workers (one shared, one
# dedicated). Every agent is attached to a human member in terms of tokens: `human:` is
# whose Claude seat it runs on. In a real lab this file lives in the lab's private config
# repository, and only what's merged to its `main` is deployed.
# Validate with:  lab check examples/minimal/lab.yaml

lab: example-lab
tailnet: example.ts.net      # sandboxed commands may reach *.example.ts.net
trust_tailnet: true          # tailnet resources count as safe (the default)

humans:
  alice:
    name: Alice
    slack_user: U00000001
    admin: true                          # may read agents' logs, administer the lab
    tailscale_login: alice@example.org   # how the web UI recognises her
    channels:
      # permissions: Slack DM only (v1). Requests wait for an answer; add timeout_s: N to
      # deny unanswered ones after N seconds.
      - {type: slack_dm, on_timeout: deny}

hosts:
  nuc-01:
    kind: onprem
  mgr-vm-01:
    kind: cloud
    provider: nebius
    instance: mgr-vm-01
    idle_stop_min: 0                # never stopped
  gpu-a:
    kind: cloud
    provider: nebius
    instance: gpu-a
    idle_stop_min: 30
  gpu-b:
    kind: cloud
    provider: nebius
    instance: gpu-b
    idle_stop_min: 30

agents:
  secretary:
    role: secretary
    human: alice
    host: nuc-01
    display_name: Iris
  mgr-alice:
    role: manager
    human: alice
    host: mgr-vm-01
    display_name: Flash
    slack_app: A00000001
    github: flash-bot          # its GitHub identity: a bot account
    turn_budget_min: 5         # its turns are cut off after 5 minutes (the default)
    workdir: ~/scratch
    grants:                  # standing grants: this manager may always read the web
      - {tool: WebFetch}
      - {tool: WebSearch}
  worker-a:
    role: worker
    human: alice
    host: gpu-a
    access: shared
    workdir: ~/work
    grants:
      - {domain: pypi.org}
      - {domain: files.pythonhosted.org}
      - {write: ~/datasets, reason: shared dataset cache}
  worker-b:
    role: worker
    human: alice
    host: gpu-b
    access: dedicated

github:
  accounts:
    flash-bot: {expires: 2027-10-01}     # its token's expiry, for reminders

credentials:
  - {name: slack/mgr-alice, host: mgr-vm-01, agent: mgr-alice, expires: null}
  - {name: claude/alice-seat-token, host: gpu-a, expires: 2027-10-01}
  - {name: github/bot-pat, host: gpu-a, expires: 2026-12-11, scope: repo}

# Base policy, shipped with the framework. Every agent starts from this; role defaults
# and per-agent overlays (see DESIGN.md §6.2) add to it or remove from it.
#
# Rule of thumb: auto-allow only what is trivially read-only. Anything that can write,
# reach the network or run other programs belongs in the cage (`sbox ...`) or gets asked.

# Read-only tools, deferred to Claude Code (which auto-approves them).
ungated_tools:
  - Read
  - Glob
  - Grep
  - LS
  - NotebookRead
  - TodoRead
  - TodoWrite
  - BashOutput
  - KillShell
  - KillBash
  - ExitPlanMode
  - ToolSearch      # only loads tool schemas; the loaded tools stay gated

# Tools whose target path must lie inside `writable` to be green.
file_tools: [Write, Edit, NotebookEdit]

# The writable green zone. Roles set it; it must mirror the cage's writable binds.
writable: []

bash:
  # A segment matching one of these (whole command, quotes removed) is read-only safe.
  # Kept deliberately narrow: commands that can run other programs or write files
  # (awk's system(), find -exec/-delete, sed's w/e commands, sort -o, rg --pre, ...)
  # are either absent or pinned to their read-only forms.
  safe_patterns:
    - '^ls(\s|$)'
    - '^cat\s'
    - '^head(\s|$)'
    - '^tail(\s|$)'
    - '^grep\s'
    - '^egrep\s'
    - '^rg\s(?!.*--pre(\s|=|$))(?!.*--search-zip)'
    - '^find\s(?!.*\s-(exec|execdir|ok|okdir|delete|fprint|fprint0|fprintf|fls)(\s|$))'
    - '^ps(\s|$)'
    - '^pgrep(\s|$)'
    - '^df(\s|$)'
    - '^du\s'
    - '^free(\s|$)'
    - '^uptime(\s|$)'
    - '^uname(\s|$)'
    - '^nvidia-smi(?=\s|$)(?!.*\s(-r|--gpu-reset|-pm|-pl|--power-limit|-ac|-rgc|-lgc|-c|--compute-mode)(\s|=|$))'
    - '^sensors(\s|$)'
    - '^ss(\s|$)'
    - '^ip\s+(-\S+\s+)*(a|addr|address|r|route|link|neigh)(\s+(show|list)(\s.*)?)?$'
    - '^tailscale\s+(status|ip|ping)(\s|$)'
    - '^systemctl\s+(--user\s+)?(status|is-active|is-enabled|list-units|show)(\s|$)'
    - '^journalctl(\s|$)(?!.*--(vacuum|rotate|flush|relinquish))'
    - '^which\s'
    - '^echo(\s|$)'
    - '^printf\s'
    - '^pwd$'
    - '^cd(\s|$)'          # changes only the cwd; every other segment is still checked
    - '^sed\s+-n\s+[0-9$,;p]+(\s|$)'   # only `sed -n 10,20p file` style printing
    - '^wc(\s|$)'
    - '^sort(?=\s|$)(?!.*\s(-o|--output)(\s|=|$))'
    - '^uniq(\s+-\S+)*(\s+\S+)?$'      # at most an input file (a 2nd arg would be written)
    - '^jq\s'
    - '^column(\s|$)'
    - '^paste\s'
    - '^cut\s'
    - '^tr\s'
    - '^basename\s'
    - '^dirname\s'
    - '^realpath\s'
    - '^date(?=\s|$)(?!.*\s(-s|--set)(\s|=|$))'
    - '^hostname$'
    - '^whoami$'
    - '^id(\s|$)'
    - '^kill\s+-0\s'
    - '^sleep\s'
    - '^test\s'
    - '^\[\s'
    - '^sha256sum\s'
    - '^md5sum\s'
    - '^stat\s'
    - '^cmp\s'
    - '^diff\s(?!.*--to-file)'
    - '^nl(\s|$)'
    - '^nproc$'
    - '^env$'

  sbox:
    enabled: false
    net_modes: []

  git:
    enabled: false
    subcommands: []

  helpers: []

monitor_commands: []
